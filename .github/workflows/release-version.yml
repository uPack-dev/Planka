name: Release Version

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: release-version-master
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare release
    runs-on: blacksmith-4vcpu-ubuntu-2404
    if: github.ref == 'refs/heads/master'
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
      release_exists: ${{ steps.release.outputs.exists }}
      tag: ${{ steps.version.outputs.tag }}
      target_sha: ${{ steps.version.outputs.target_sha }}
      version: ${{ steps.version.outputs.version }}
      version_changed: ${{ steps.version.outputs.changed }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Read package version and detect changes
        id: version
        run: |
          TARGET_SHA="${{ github.sha }}"
          BEFORE_SHA="${{ github.event.before }}"
          VERSION="$(node -p "require('./package.json').version")"

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::package.json version '$VERSION' is not a valid release version"
            exit 1
          fi

          if [ -z "$BEFORE_SHA" ] || [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            BEFORE_SHA="$(git rev-parse "${TARGET_SHA}^" 2>/dev/null || true)"
          fi

          PREVIOUS_VERSION=""
          if [ -n "$BEFORE_SHA" ] && git cat-file -e "$BEFORE_SHA:package.json" 2>/dev/null; then
            PREVIOUS_VERSION="$(git show "$BEFORE_SHA:package.json" | node -pe "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")"
          fi

          if [ "$VERSION" != "$PREVIOUS_VERSION" ]; then
            CHANGED=true
            echo "Version changed from '${PREVIOUS_VERSION:-none}' to '$VERSION'."
          else
            CHANGED=false
            echo "Version '$VERSION' is unchanged. Skipping version release."
          fi

          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE=true
          else
            PRERELEASE=false
          fi

          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
          echo "target_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check existing release
        if: steps.version.outputs.changed == 'true'
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release '$TAG' already exists. Skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check existing tag target
        if: steps.version.outputs.changed == 'true' && steps.release.outputs.exists == 'false'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          TARGET_SHA: ${{ steps.version.outputs.target_sha }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            TAG_SHA="$(git rev-list -n 1 "$TAG")"

            if [ "$TAG_SHA" != "$TARGET_SHA" ]; then
              echo "::error::Tag '$TAG' already exists at $TAG_SHA, expected $TARGET_SHA"
              exit 1
            fi
          fi

  release:
    name: Build package and publish release
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: prepare
    if: needs.prepare.outputs.version_changed == 'true' && needs.prepare.outputs.release_exists == 'false'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.target_sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          node-version: "22"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build server
        run: pnpm --filter planka-server build

      - name: Build client
        run: INDEX_FORMAT=ejs DISABLE_ESLINT_PLUGIN=true pnpm --filter planka-client build

      - name: Create release package
        run: |
          mv LICENSE.md server/dist
          mv "LICENSES/PLANKA Community License DE.md" server/dist/LICENSE_DE.md
          mv client/dist/* server/dist/public
          mv server/dist/public/index.ejs server/dist/views
          mv server/dist server/planka
          cd server
          zip -r ../planka-prebuild.zip planka

      - name: Prepare release notes
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          awk -v version="$VERSION" '
            $0 ~ "^#{1,2} \\[" version "\\]" {
              capture = 1
              print
              next
            }

            capture && $0 ~ "^#{1,2} \\[[^]]+\\]" {
              exit
            }

            capture {
              print
            }
          ' client/src/assets/docs/whats-new.md > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "Release $VERSION" > release-notes.md
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          TAG: ${{ needs.prepare.outputs.tag }}
          TARGET_SHA: ${{ needs.prepare.outputs.target_sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          ARGS=()

          if [ "$PRERELEASE" = "true" ]; then
            ARGS+=(--prerelease)
          fi

          gh release create "$TAG" planka-prebuild.zip \
            --target "$TARGET_SHA" \
            --title "v$VERSION" \
            --notes-file release-notes.md \
            "${ARGS[@]}"
